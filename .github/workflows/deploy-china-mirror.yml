name: Deploy to China Mirror

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-to-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and build on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            echo "=== Adding local deploy key FIRST ==="
            mkdir -p ~/.ssh
            echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL77R/gdIAsLl1f/CXwYces5028CxOFuPSx4KYpincrK hh-blog-deploy' >> ~/.ssh/authorized_keys
            chmod 700 ~/.ssh
            chmod 600 ~/.ssh/authorized_keys
            echo "Local deploy key added."
            echo "Current authorized_keys:"
            cat ~/.ssh/authorized_keys

            cd /opt/xhblogs-full

            sudo systemctl stop xhblogs-full
            sudo docker stop lsky-free mysql_z3rp-mysql_z3rP-1 2>/dev/null || true

            echo "Fetching latest code..."
            for i in 1 2 3; do
              git fetch origin main && break || {
                echo "Fetch attempt $i failed, retrying in 5s..."
                sleep 5
              }
            done
            git reset --hard origin/main
            echo "Current HEAD: $(git rev-parse HEAD)"

            chmod +x scripts/deploy-portal.sh
            bash scripts/deploy-portal.sh || echo "WARNING: Portal deployment had issues"

            npm install
            NODE_OPTIONS="--max-old-space-size=2048" npm run build
            cp -r .next/static .next/standalone/.next/

            sudo systemctl start xhblogs-full
            sudo docker start mysql_z3rp-mysql_z3rP-1 lsky-free 2>/dev/null || true

            sleep 3
            curl -s -o /dev/null -w "Blog HTTP status: %{http_code}\n" http://127.0.0.1:3003/ || echo "WARNING: blog not responding"
            echo "=== Deployment Complete ==="