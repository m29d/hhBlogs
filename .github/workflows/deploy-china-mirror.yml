name: Deploy to China Mirror

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-to-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Package build output
        run: tar czf next-build.tar.gz .next

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "next-build.tar.gz"
          target: "/opt/xhblogs-full"
          timeout: 120

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60
          script: |
            cd /opt/xhblogs-full
            git pull origin main
            rm -rf .next-old
            mv .next .next-old 2>/dev/null
            tar xzf next-build.tar.gz
            rm -f next-build.tar.gz
            rm -rf .next-old
            systemctl restart xhblogs-full
