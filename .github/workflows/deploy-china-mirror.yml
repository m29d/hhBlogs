name: Deploy to China Mirror

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-to-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip web editor commits - handled by server-side rebuild.sh
    if: "!contains(github.event.head_commit.message, 'via web editor')"
    steps:
      - name: Deploy and build on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/xhblogs-full

            # Stop services to free memory for build
            sudo systemctl stop xhblogs-full
            sudo docker stop lsky-free mysql_z3rp-mysql_z3rP-1 2>/dev/null

            # Pull latest code
            git pull origin main

            # Install dependencies and build
            npm install
            NODE_OPTIONS="--max-old-space-size=2048" npm run build

            # Copy static files to standalone
            cp -r .next/static .next/standalone/.next/

            # Restart services
            sudo systemctl start xhblogs-full
            sudo docker start mysql_z3rp-mysql_z3rP-1 lsky-free 2>/dev/null

            # Verify blog is up
            sleep 3
            curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3003/ || echo "WARNING: blog not responding"
