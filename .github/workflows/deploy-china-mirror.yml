name: Deploy to China Mirror

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-to-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and build on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            
            cd /opt/xhblogs-full
            
            # Stop services to free memory for build
            sudo systemctl stop xhblogs-full
            sudo docker stop lsky-free mysql_z3rp-mysql_z3rP-1 2>/dev/null || true
            
            # Fetch latest code FIRST
            echo "=== Fetching latest code ==="
            for i in 1 2 3; do
              git fetch origin main && break || {
                echo "Fetch attempt $i failed, retrying in 5s..."
                sleep 5
              }
            done
            git reset --hard origin/main
            echo "Current HEAD: $(git rev-parse HEAD)"
            
            # Deploy portal page (now that code is fetched)
            echo "=== Deploying Portal ==="
            sudo mkdir -p /var/www/portal
            if [ -f /opt/xhblogs-full/portal/index.html ]; then
              sudo cp /opt/xhblogs-full/portal/index.html /var/www/portal/
              sudo cp /opt/xhblogs-full/portal/bg.jpg /var/www/portal/
              echo "Portal files deployed to /var/www/portal/"
            else
              echo "WARNING: Portal files not found"
            fi
            
            # Configure Nginx
            echo "=== Configuring Nginx ==="
            NGINX_CONF=""
            if [ -f /etc/nginx/sites-enabled/default ]; then
              NGINX_CONF="/etc/nginx/sites-enabled/default"
            elif [ -f /etc/nginx/conf.d/default.conf ]; then
              NGINX_CONF="/etc/nginx/conf.d/default.conf"
            fi
            
            if [ -n "$NGINX_CONF" ] && [ -f /var/www/portal/index.html ]; then
              # Check if portal config already exists
              if [ ! -f /etc/nginx/sites-enabled/hhblog-portal ]; then
                echo "Setting up Nginx portal config..."
                sudo cp "$NGINX_CONF" "$NGINX_CONF.bak.$(date +%Y%m%d%H%M%S)"
                
                SSL_CERT=$(grep -oP 'ssl_certificate\s+\K[^;]+' "$NGINX_CONF" | head -1)
                SSL_KEY=$(grep -oP 'ssl_certificate_key\s+\K[^;]+' "$NGINX_CONF" | head -1)
                echo "SSL cert: $SSL_CERT | key: $SSL_KEY"
                
                if [ -n "$SSL_CERT" ] && [ -n "$SSL_KEY" ]; then
                  cat > /tmp/hhblog-portal.conf << 'PORTALEOF'
server {
    listen 80;
    server_name hhblog.tech www.hhblog.tech;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name hhblog.tech www.hhblog.tech;
    
    ssl_certificate SSL_CERT_PLACEHOLDER;
    ssl_certificate_key SSL_KEY_PLACEHOLDER;
    
    root /var/www/portal;
    index index.html;
    
    location / {
        try_files $uri $uri/ =404;
    }
}
PORTALEOF

                  cat > /tmp/blog-subdomain.conf << 'BLOGEOF'
server {
    listen 80;
    server_name blog.hhblog.tech;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name blog.hhblog.tech;
    
    ssl_certificate SSL_CERT_PLACEHOLDER;
    ssl_certificate_key SSL_KEY_PLACEHOLDER;
    
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
BLOGEOF

                  sudo sed -i "s|SSL_CERT_PLACEHOLDER|$SSL_CERT|g" /tmp/hhblog-portal.conf
                  sudo sed -i "s|SSL_KEY_PLACEHOLDER|$SSL_KEY|g" /tmp/hhblog-portal.conf
                  sudo sed -i "s|SSL_CERT_PLACEHOLDER|$SSL_CERT|g" /tmp/blog-subdomain.conf
                  sudo sed -i "s|SSL_KEY_PLACEHOLDER|$SSL_KEY|g" /tmp/blog-subdomain.conf
                  
                  sudo cp /tmp/hhblog-portal.conf /etc/nginx/sites-enabled/hhblog-portal
                  sudo cp /tmp/blog-subdomain.conf /etc/nginx/sites-enabled/blog-subdomain
                  
                  if sudo nginx -t 2>&1; then
                    echo "Nginx test passed. Removing old default config."
                    sudo rm -f "$NGINX_CONF"
                    sudo systemctl reload nginx
                    echo "Nginx configured for portal + blog subdomain"
                  else
                    echo "Nginx test FAILED. Restoring backup."
                    sudo rm -f /etc/nginx/sites-enabled/hhblog-portal /etc/nginx/sites-enabled/blog-subdomain
                    sudo cp "$NGINX_CONF.bak."* "$NGINX_CONF" 2>/dev/null || true
                  fi
                else
                  echo "WARNING: SSL cert paths not found. Skipping Nginx config."
                fi
              else
                echo "Portal Nginx config already exists. Skipping."
              fi
            fi
            
            # Build blog
            echo "=== Building Blog ==="
            npm install
            NODE_OPTIONS="--max-old-space-size=2048" npm run build
            cp -r .next/static .next/standalone/.next/
            
            # Restart services
            echo "=== Restarting Services ==="
            sudo systemctl start xhblogs-full
            sudo docker start mysql_z3rp-mysql_z3rP-1 lsky-free 2>/dev/null || true
            
            sleep 3
            curl -s -o /dev/null -w "Blog HTTP status: %{http_code}\n" http://127.0.0.1:3003/ || echo "WARNING: blog not responding"
            echo "=== Deployment Complete ==="