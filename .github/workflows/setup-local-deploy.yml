name: Setup Local Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Add local deploy key and debug SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            echo "=== SSH Debug Info ==="
            echo "User: $(whoami)"
            echo "Home: $HOME"

            echo "=== Checking .ssh directory ==="
            ls -la ~/.ssh/ 2>/dev/null || echo "No .ssh dir"

            echo "=== Checking authorized_keys ==="
            cat ~/.ssh/authorized_keys 2>/dev/null || echo "No authorized_keys"

            echo "=== Adding local deploy key ==="
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys

            PUB_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL77R/gdIAsLl1f/CXwYces5028CxOFuPSx4KYpincrK hh-blog-deploy"
            if grep -q "hh-blog-deploy" ~/.ssh/authorized_keys 2>/dev/null; then
              echo "Key already exists"
            else
              echo "$PUB_KEY" >> ~/.ssh/authorized_keys
              echo "Key added"
            fi

            echo "=== Verifying ==="
            cat ~/.ssh/authorized_keys
            ls -la ~/.ssh/

            echo "=== SSHD config check ==="
            grep -i "PubkeyAuthentication\|PermitRootLogin\|AuthorizedKeysFile" /etc/ssh/sshd_config 2>/dev/null | grep -v "^#"

            echo "=== Testing SSH config ==="
            sudo sshd -t 2>&1 && echo "SSHD config OK" || echo "SSHD config ERROR"

            echo "=== Reloading SSHD ==="
            sudo systemctl reload sshd 2>/dev/null || sudo systemctl reload ssh 2>/dev/null || echo "Could not reload sshd"

            echo "=== DONE ==="
